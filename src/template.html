<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="{{ROBOTS}}">
{{HREFLANG}}
<meta name="author" content="{{AUTHOR}}">
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<meta name="theme-color" content="#2453d6">
<link rel="icon" href="{{BASE}}icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{BASE}}apple-touch-icon.png">
<link rel="manifest" href="{{BASE}}manifest.webmanifest">
{{FONTS}}
<link rel="stylesheet" href="{{BASE}}assets/style.css?v={{VERSION}}">
<link rel="stylesheet" href="{{BASE}}assets/content.css?v={{VERSION}}">
<link rel="modulepreload" href="{{BASE}}assets/app.js?v={{VERSION}}">
{{PRELOAD}}
<script>try{var t=JSON.parse(localStorage.getItem('calc.theme'));document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<script>window.SITE={{CONFIG_JSON}};</script>
{{HEAD_EXTRA}}
</head>
<body data-page="{{PAGE}}" data-calc="{{CALC_ID}}">
<a class="skip" href="#main">{{t:Skip to content}}</a>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="{{HOME}}"><span class="logo-mark">=</span>{{SITE_NAME}}</a>
    <div class="search-box" role="search">
      <input type="search" placeholder="{{SEARCH_PH}}" aria-label="{{t:Search calculators}}" autocomplete="off">
      <ul class="search-results" role="listbox" hidden></ul>
    </div>
    <div class="header-tools">
      {{LANG_TOOLS}}
      <select id="currency" aria-label="{{t:Currency}}"></select>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="{{t:Toggle dark mode}}">🌙</button>
    </div>
  </div>
</header>
<div class="ad-slot ad-top" data-slot="top" role="complementary" aria-label="{{t:Advertisement}}"></div>
<div class="layout">
  <main id="main">
{{MAIN}}
  </main>
  <aside class="sidebar">
{{SIDEBAR}}
  </aside>
</div>
<footer class="site-footer">
{{FOOTER}}
</footer>
<div id="consent" class="consent card" hidden role="dialog" aria-label="{{t:Cookie consent}}">
  <p>{{CONSENT_TEXT}}</p>
  <div class="btns"><button class="btn" data-consent="reject" type="button">{{t:Reject}}</button><button class="btn primary" data-consent="accept" type="button">{{t:Accept}}</button></div>
</div>
<script type="module" src="{{BASE}}assets/app.js?v={{VERSION}}"></script>
</body>
</html>
